# Each entry is a [line_a, line_b] pair used when two idle people become
# proximate. Not tied to specific people — assigned randomly at runtime.
exchanges:
  - ["Did you see the sync fail again?", "Classic."]
  - ["Are you on the call?", "What call?"]
  - ["Coffee?", "Always."]
  - ["Is it deployed yet?", "It's building."]
  - ["Who broke the pipeline?", "Not me this time."]
  - ["Got five minutes?", "For you, always."]
  - ["Did you push your changes?", "Pushing now."]
  - ["Standup in five.", "Already forgot what I did."]
  - ["I fixed the bug.", "You mean you added a new one."]
  - ["Have you tried turning it off and on again?", "That's IT's whole personality."]
  - ["Who approved this meeting?", "Nobody. It multiplied on its own."]
  - ["This should be a quick fix.", "Famous last words."]
  - ["I'll have it done by Friday.", "Which Friday, though?"]
  - ["Did you read my email?", "Define 'read'."]
  - ["Can we sync offline?", "Isn't that just... talking?"]
  - ["I think it's a caching issue.", "It's always a caching issue."]
  - ["Quick question.", "There's no such thing."]
  - ["I'm blocked.", "By what, motivation?"]
  - ["Let's take this offline.", "We're already standing here."]
  - ["Did you get my Slack message?", "I have 400 unread. Which one?"]
  - ["It works in staging.", "That's the worst kind of works."]
  - ["Just one more small change.", "That's how it always starts."]
  - ["Whose desk is this?", "Nobody knows. It's cursed."]
  - ["I need your sign-off on this.", "My blind approve costs extra coffee."]
  - ["The client wants it 'pop more'.", "Pop more. Very actionable."]
  - ["Did you back up before deploying?", "...I deployed."]
  - ["Is this urgent?", "Everything's urgent until 5pm."]
  - ["I rebooted my brain this morning.", "Did it install the updates?"]
  - ["My code works.", "On your machine, in your dreams, in this economy?"]
  - ["I think I'm getting promoted.", "To what, senior stress absorber?"]
  - ["Who ate my labeled lunch?", "The fridge is a lawless place."]
  - ["Can you review my PR?", "Adding it to the pile. The pile is sentient now."]
  - ["I found the root cause.", "Was it Steve? It's usually Steve."]
  - ["I'm indispensable here.", "Bold words for someone on mute all the time."]
  - ["The printer's jammed again.", "It senses fear. Don't run."]
  - ["I optimized the algorithm.", "Does it still return the wrong answer, just faster?"]
  - ["We need to align on this.", "Align like planets, or like IKEA furniture?"]
  - ["I'm allergic to Mondays.", "Science has yet to find a cure."]
  - ["I finally understand the codebase.", "Please, write it down before you forget."]
  - ["My calendar is a warzone.", "Send reinforcements, or at least coffee."]
  - ["Is the client happy?", "Define happy. Define client. Define happy."]
  - ["This meeting could've been an email.", "This email could've been a nap."]
  - ["I broke prod.", "Character development."]
  - ["The AI wrote this for me.", "Explains the confidence and the lies."]
  - ["I've mastered work-life balance.", "You replied to Teams at 11pm yesterday."]
  - ["Free broodjes in the kitchen!", "That's the fastest I've moved all week."]
  - ["I'm not stressed.", "Your left eye is twitching."]
  - ["I read the whole thread.", "All 200 replies? Liar."]
  - ["Who scheduled a meeting at 8am?", "Someone who hates joy."]
  - ["I have a great idea.", "Write it down before HR hears it."]
  - ["I'm on a diet.", "You're holding a donut in each hand."]
  - ["I think my chair is broken.", "That's not the chair, that's your posture."]
  - ["I never miss a deadline.", "You're currently missing one."]
  - ["I'm the fastest typer here.", "You just typed 'the the' three times."]
  - ["I've read the terms and conditions.", "Nobody has ever read the terms and conditions."]
  - ["I know exactly what I'm doing.", "That's the scariest thing you've said all day."]
  - ["I'm great under pressure.", "You just screamed at your stapler."]
  - ["This is a judgment-free zone.", "I'm judging you right now."]
  - ["I never gossip.", "You're literally telling me gossip."]
  - ["My password is very secure.", "It's 'password123', isn't it."]
  - ["I'm basically management material.", "You just microwaved fish. Again."]
  - ["I've never used ChatGPT.", "Your email had 'as an AI language model' in it."]
  - ["I'm a very private person.", "You narrate your bathroom breaks in the group chat."]
  - ["I have zero unread emails.", "Liar. Nobody has zero unread emails."]
  - ["I could do your job in my sleep.", "Please demonstrate. Right now. Asleep."]
  - ["This spreadsheet is a masterpiece.", "It's 40 tabs of pure chaos."]
  - ["I'm very punctual.", "You've been 'on my way' for twenty minutes."]
  - ["I'm not paranoid.", "Then why do you close your laptop when I walk by?"]
  - ["I love Mondays.", "Nobody loves Mondays. Seek help."]
  - ["I invented that idea.", "It's in the onboarding deck from three years ago."]
  - ["I'm basically the CEO's best friend.", "You've spoken to him once, in an elevator."]
  - ["My code has zero bugs.", "It also has zero comments and zero tests."]
  - ["I do my best thinking in meetings.", "You were asleep in that meeting."]
  - ["I never procrastinate.", "You're procrastinating right now, talking to me."]
